<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">对标拆解选题工厂 — 把头部博主深挖到底，逆向产出选题库</title>
  <desc id="desc">8 阶段流水线：找对标 → 拆选题、稿子、展现形式、变现全量数据 → 逆向出选题。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="14" fill="#F5F3FF"/>
  <rect x="1" y="1" width="1198" height="358" rx="14" fill="none" stroke="#DDD6FE" stroke-width="1.5"/>

  <g id="title-block">
    <rect x="64" y="62" width="12" height="12" fill="#DB2777"/>
    <text class="mono" x="86" y="74" font-size="17" letter-spacing="2" fill="#6B7280">对标拆解 · SKILL</text>
    <text class="sans" x="64" y="152" font-size="72" font-weight="700" fill="#1E1B4B">选题工厂</text>
    <text class="sans" x="64" y="196" font-size="26" font-weight="700" fill="#6D28D9">逆向 100 条选题库 + 口播文案</text>
    <text class="sans" x="64" y="238" font-size="21" fill="#1E1B4B">100 条选题没有一条凭空想，每条注明逆向自谁。</text>
  </g>

  <line x1="700" y1="56" x2="700" y2="256" stroke="#DDD6FE" stroke-width="1.5"/>

  <g id="proof">
    <text class="sans" x="740" y="74" font-size="17" fill="#6B7280">选题库的三个硬指标</text>
    <text class="mono" x="740" y="118" font-size="20" font-weight="700" fill="#DB2777">100 条</text>
    <text class="sans" x="813" y="118" font-size="22" font-weight="700" fill="#1E1B4B">逆向选题库</text>
    <text class="mono" x="740" y="164" font-size="20" font-weight="700" fill="#DB2777">8 阶段</text>
    <text class="sans" x="811" y="164" font-size="22" font-weight="700" fill="#1E1B4B">对标拆解流水线</text>
    <text class="mono" x="740" y="210" font-size="20" font-weight="700" fill="#DB2777">全量</text>
    <text class="sans" x="794" y="210" font-size="22" font-weight="700" fill="#1E1B4B">选题 / 稿子 / 形式 / 变现</text>
  </g>

  <line x1="64" y1="288" x2="1136" y2="288" stroke="#DDD6FE" stroke-width="1.5"/>
  <g id="install">
    <text class="mono" x="64" y="327" font-size="16" fill="#6B7280">安装</text>
    <text class="mono" x="140" y="327" font-size="20" font-weight="700" fill="#6D28D9">npx skills add lhg-skills/lhg-benchmark-topic-factory</text>
  </g>
</svg>
